[project]
name = "dashcam-restore"
version = "0.1.0"
description = "Rebuild the missing moov atom of broken Novatek-style dashcam MP4 files"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dashcam-restore = "dashcam_restore:main"

[project.gui-scripts]
dashcam-restore-gui = "dashcam_restore.gui:main"

[dependency-groups]
dev = ["pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashcam_restore"]
